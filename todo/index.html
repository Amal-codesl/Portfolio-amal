<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Amal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 40px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-btn {
      background: #667eea;
      color: white;
    }

    .add-btn:hover {
      opacity: 0.9;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #f5f5f5;
      padding: 13px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    .task-text {
      flex: 1;
      cursor: pointer;
    }

    .completed {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: #ff5c5c;
      color: white;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px;
    }

    @media (max-width: 500px) {
      .input-box {
        flex-direction: column;
      }

      .add-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>✅ لائحة مهامي</h1>
    <p class="subtitle">نظّم مهامك وأنجزها بسهولة</p>

    <div class="input-box">
      <input id="taskInput" type="text" placeholder="كتب مهمة جديدة...">
      <button class="add-btn" onclick="addTask()">إضافة</button>
    </div>

    <ul id="taskList">
      <li class="empty">ما كايناش مهام دابا 😊</li>
    </ul>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    function addTask() {
      const text = taskInput.value.trim();

      if (text === "") {
        alert("كتب المهمة أولا 😊");
        return;
      }

      const empty = document.querySelector(".empty");
      if (empty) {
        empty.remove();
      }

      const li = document.createElement("li");

      const span = document.createElement("span");
      span.className = "task-text";
      span.textContent = text;

      span.onclick = function () {
        span.classList.toggle("completed");
      };

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "حذف";

      deleteBtn.onclick = function () {
        li.remove();

        if (taskList.children.length === 0) {
          taskList.innerHTML =
            '<li class="empty">ما كايناش مهام دابا 😊</li>';
        }
      };

      li.appendChild(span);
      li.appendChild(deleteBtn);
      taskList.appendChild(li);

      taskInput.value = "";
      taskInput.focus();
    }

    taskInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        addTask();
      }
    });
  </script>

</body>
  </html>
